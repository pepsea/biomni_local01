[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomni-hypo"
version = "0.1.0"
description = "Biomni を用いた仮説構築 Web アプリ（Ollama ローカル実行・商用利用限定）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# エージェント本体。重いのでノートブック 03 まではこれ無しで動く
agent = [
    "biomni>=0.0.8",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    # biomni 0.0.8 の pyproject が宣言していない実依存（A1 の import に必要）
    "pandas>=2.0",
    "tqdm>=4.66",
    "langchain-openai>=0.2",
    # ツールモジュールの実依存（これが無いとツールが 1 つも実行できない）
    "biopython>=1.83",
    "beautifulsoup4>=4.12",
    "PyPDF2>=3.0",
    # literature モジュールを import 可能にするため（ツール自体はポリシーで拒否）
    "googlesearch-python>=1.2",
]

# 重い。genomics / genetics モジュールを使うときだけ
heavy-tools = [
    "torch>=2.0",
    "fair-esm>=2.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jupyterlab>=4.0",
    "ruff>=0.5",
    "pip-licenses>=5.0",
]

[tool.setuptools.packages.find]
include = ["biomni_hypo*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` の console script は cwd を sys.path に入れない（`python -m pytest` は入れる）。
# これが無いと `pytest -q` だけ ModuleNotFoundError で落ちる。
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
