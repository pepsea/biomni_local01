[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomni-hypo"
version = "0.1.0"
description = "Biomni を用いた仮説構築 Web アプリ（Ollama ローカル実行・商用利用限定）"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# エージェント本体。重いのでノートブック 03 まではこれ無しで動く
agent = [
    "biomni>=0.0.8",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "jupyterlab>=4.0",
    "ruff>=0.5",
    "pip-licenses>=5.0",
]

[tool.setuptools.packages.find]
include = ["biomni_hypo*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
