# 常駐させる構成。
#
#   docker compose up -d              起動（バックグラウンド）
#
# ポートを変えるには .env に:  APP_PORT=9000
# 外部に出したくないなら:      APP_BIND=127.0.0.1
#
# Ollama はホストで動いているものだけを使う。コンテナ版は持たない
# （docs/design/21 §21.15）。同居させると:
#   - ポート 11434 が衝突する
#   - 9GB のモデルを二重に持つ
#   - 空のコンテナ版をアプリが掴んで「モデルが全部 未取得」になる
# 接続先は .env の OLLAMA_BASE_URL（bash scripts/set-provider.sh ollama が設定）
#   docker compose logs -f app        ログを追う
#   docker compose ps                 状態
#   docker compose down               停止（モデルとデータは残る）
#
# restart: unless-stopped なので、マシンを再起動しても Docker が上がれば
# アプリも自動で戻る。明示的に down するまで動き続ける。
#
# LLM が生成した任意コードを実行するため、app は権限を絞ってある
# （docs/design/02-architecture.md §2.6）。

services:
  app:
    build:
      context: .
      args:
        # ホストの UID/GID に合わせる。scripts/install-service.sh が .env に書く
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    container_name: biomni-app
    restart: unless-stopped
    ports:
      # ホスト側のポートは .env の APP_PORT で変えられる（コンテナ内は 8000 固定）。
      # 外部に出したくないなら APP_BIND=127.0.0.1
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-5002}:8000"
    environment:
      # environment: は env_file: より強い。ここをベタ書きすると .env の
      # OLLAMA_BASE_URL が無視され、.env の設定が効かなくなる。
      # 既定はホストの Ollama。.env にあればそちらを使う（docs/design/17）
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      BIOMNI_PATH: /app/data
      # ラン履歴（sqlite）は名前付きボリュームに置く。
      # ./workspace は bind マウントなので、リポジトリがネットワークマウントの
      # 上にあると sqlite を開けない（ロックが効かない）。ホスト側の置き場所の
      # 制約をコンテナが引き継いでしまう（docs/design/27）。
      # 名前付きボリュームは Docker のローカルストレージなので、その制約が無く、
      # 再ビルドでも消えない。.env で上書きもできる。
      HYPO_WORKSPACE: "${HYPO_WORKSPACE:-/app/state}"
      HYPO_POLICY_PATH: /app/config/resource_policy.yaml
      HYPO_PROVIDER: "${HYPO_PROVIDER:-ollama}"
      HYPO_MODEL: "${HYPO_MODEL:-qwen3:14b}"
      BIOMNI_LLM: "${HYPO_MODEL:-qwen3:14b}"
      # biomni の default_config が向く先。provider に合わせる（docs/design/04 §4.3）
      BIOMNI_SOURCE: "${BIOMNI_SOURCE:-Ollama}"
      LLM_SOURCE: "${BIOMNI_SOURCE:-Ollama}"
      BIOMNI_COMMERCIAL_MODE: "true"
      HYPO_NUM_CTX: "${HYPO_NUM_CTX:-32768}"
      # Claude API を使う場合だけ。ホストの環境変数か .env から渡る
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    env_file:
      - path: .env
        required: false
    # ホストに直接入れた Ollama を使う場合の名前解決（Linux で必要）。
    # OLLAMA_BASE_URL=http://host.docker.internal:11434 と組み合わせる
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data                       # データレイク（再取得を避ける）
      - ./workspace:/app/workspace             # 生成物を手元から見たい場合の置き場
      - hypo-state:/app/state                  # ラン履歴（sqlite）。ローカルストレージ
      - ./config:/app/config:ro                # リソースポリシー
    # LLM 生成コードを実行するので権限を絞る
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 8g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 常設するのでログでディスクを埋めない
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  hypo-state:
