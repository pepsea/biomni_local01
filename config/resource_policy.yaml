# 商用利用限定のリソースポリシー（docs/design/05-commercial-licensing.md）
#
# 既定拒否。ここに書かれていないデータセットは使えない。
# ライセンス欄は Biomni 同梱の license_info.md を出発点にしている。
# 実運用前に法務レビューを行うこと（本ファイルはレビューの対象を絞るためのもの）。
policy_version: 1
mode: commercial_only

datasets:
  allow:
    - name: gwas_catalog.pkl
      license: Apache-2.0
      attribution: EBI GWAS Catalog
      url: https://www.ebi.ac.uk/gwas/
    - name: gene_info.parquet
      license: Public-Domain
      attribution: NCBI Gene
      url: https://www.ncbi.nlm.nih.gov/gene
    - name: go-plus.json
      license: CC-BY-4.0
      attribution: Gene Ontology Consortium
      url: http://geneontology.org/
    - name: hp.obo
      license: HPO-Free
      attribution: Human Phenotype Ontology
      url: https://hpo.jax.org/
    - name: DepMap_CRISPRGeneEffect.csv
      license: CC-BY-4.0
      attribution: DepMap, Broad Institute
      url: https://depmap.org/
    - name: DepMap_CRISPRGeneDependency.csv
      license: CC-BY-4.0
      attribution: DepMap, Broad Institute
    - name: DepMap_Model.csv
      license: CC-BY-4.0
      attribution: DepMap, Broad Institute
    - name: DepMap_OmicsExpressionProteinCodingGenesTPMLogp1.csv
      license: CC-BY-4.0
      attribution: DepMap, Broad Institute
    - name: broad_repurposing_hub_molecule_with_smiles.parquet
      license: CC-BY-4.0
      attribution: Broad Institute Drug Repurposing Hub
    - name: broad_repurposing_hub_phase_moa_target_info.parquet
      license: CC-BY-4.0
      attribution: Broad Institute Drug Repurposing Hub
    - name: genebass_pLoF_filtered.pkl
      license: ODC-By-1.0
      attribution: Genebass
    - name: genebass_missense_LC_filtered.pkl
      license: ODC-By-1.0
      attribution: Genebass
    - name: czi_census_datasets_v4.parquet
      license: CC-BY-4.0
      attribution: CZI CELLxGENE Census
    - name: mousemine_mh_hallmark_geneset.parquet
      license: CC-BY-4.0
      attribution: MouseMine
      note: MSigDB Hallmark の商用可な代替（マウス）
    - name: mousemine_m5_ontology_geneset.parquet
      license: CC-BY-4.0
      attribution: MouseMine
    - name: txgnn_prediction.pkl
      license: MIT
      attribution: TxGNN
    - name: txgnn_name_mapping.pkl
      license: MIT
      attribution: TxGNN
    - name: variant_table.parquet
      license: Public-Domain
      attribution: NCBI
    - name: marker_celltype.parquet
      license: CC-BY-4.0
      attribution: Biomni data lake

  # 取得はするが、UI とレポートで注意バッジを出す
  review_required:
    - name: proteinatlas.tsv
      license: CC-BY-SA-3.0
      attribution: Human Protein Atlas
      note: ShareAlike（継承）条項あり。派生物の再配布形態を法務確認
    - name: affinity_capture-ms.parquet
      license: OSL-3.0
      attribution: BioGRID
      note: コピーレフト系。SaaS 提供時の扱いを要確認
    - name: two-hybrid.parquet
      license: OSL-3.0
      attribution: BioGRID
      note: コピーレフト系
    - name: gtex_tissue_gene_tpm.parquet
      license: GTEx-Terms
      attribution: GTEx Consortium
      note: 集計値のみ利用。個票は dbGaP 管理アクセス

  deny_reason_default: "商用利用の許可リストに無いデータセット"

tools:
  # Biomni の commercial_mode はツールを絞らないため、ここで塞ぐ
  deny:
    - name: query_kegg
      reason: KEGG は学術利用のみ無償。商用は要ライセンス契約
    - name: query_scholar
      reason: Google Scholar のスクレイピングは ToS 違反の懸念
    - name: search_google
      reason: 同上。必要なら正規の Search API 契約に置換
    - name: advanced_web_search_claude
      reason: 外部 LLM API（Anthropic）を呼ぶ。ローカル完結の前提に反する
  review_required:
    - name: query_cbioportal
      reason: 収載元データセットごとにライセンスが異なる
    - name: query_synapse
      reason: データセットごとに利用条件が異なる
  allow: "*"

libraries:
  deny:
    - PyLabRobot
    - nnunet

models:
  # ローカルの Ollama にある任意のモデルを判定できるよう、ファミリー単位で書く。
  # `qwen3:14b` も `qwen3:8b-instruct-q4_K_M` も同じ規則で拾えるようにするため。
  #
  # 判定順:
  #   1. deny_families に前方一致 -> 拒否（allow より強い）
  #   2. allow の完全一致        -> 許可
  #   3. allow_families に前方一致 -> 許可
  #   4. どれにも当たらない       -> 拒否（既定拒否）
  allow_licenses: [Apache-2.0, MIT, BSD-3-Clause]

  deny_families:
    - match: llama
      license: Llama Community License
      reason: MAU 条項と命名条項があるため既定で不可
    - match: codellama
      license: Llama Community License
      reason: 同上
    - match: gemma
      license: Gemma Terms of Use
      reason: 利用制限条項があるため既定で不可
    - match: codegemma
      license: Gemma Terms of Use
      reason: 同上
    - match: medgemma
      license: Health AI Developer Foundations Terms
      reason: 用途制限条項があるため既定で不可
    - match: command-r
      license: CC-BY-NC-4.0
      reason: 非商用ライセンス
    - match: aya
      license: CC-BY-NC-4.0
      reason: 非商用ライセンス
    - match: deepseek-coder-v2
      license: DeepSeek License
      reason: 用途制限条項あり。DeepSeek-R1 の MIT とは別物
    - match: mistral-large
      license: Mistral Research License
      reason: 研究用途限定。同じ mistral でも small/nemo の Apache-2.0 とは別物
    - match: codestral
      license: MNPL
      reason: Mistral Non-Production License（非商用）
    - match: pixtral-large
      license: Mistral Research License
      reason: 研究用途限定

  allow_families:
    - match: qwen3
      license: Apache-2.0
      note: 推奨。コード生成とタグ追従が安定
    - match: qwen2.5
      license: Apache-2.0
    - match: qwq
      license: Apache-2.0
    - match: gpt-oss
      license: Apache-2.0
    - match: deepseek-r1
      license: MIT
      note: 思考トークンが長い。stop 制御との相性を要検証
    - match: deepseek-v3
      license: MIT
    - match: phi4
      license: MIT
    - match: phi3
      license: MIT
    - match: mistral
      license: Apache-2.0
    - match: mixtral
      license: Apache-2.0
    - match: devstral
      license: Apache-2.0
    - match: magistral
      license: Apache-2.0
    - match: olmo2
      license: Apache-2.0
    - match: granite3
      license: Apache-2.0
    - match: smollm2
      license: Apache-2.0
    - match: nomic-embed-text
      license: Apache-2.0

  # 動作確認済みの推奨モデル。未取得でも UI に出して pull を促す
  allow:
    - name: qwen3:14b
      license: Apache-2.0
      recommended: true
    - name: qwen3:8b
      license: Apache-2.0
      recommended: true
    - name: qwen3:32b
      license: Apache-2.0
    - name: gpt-oss:20b
      license: Apache-2.0
    - name: qwen2.5-coder:14b
      license: Apache-2.0
    - name: qwen2.5-coder:7b
      license: Apache-2.0
    - name: deepseek-r1:14b
      license: MIT

  deny_reason_default: "ライセンス未確認のモデルです。config/resource_policy.yaml の models に追加してください"

# クラウド API のモデル。商用利用は各社の利用規約に従う（重みのライセンスとは別問題）。
# ★ ローカル完結の前提が崩れる: 質問文・実行結果・取得データが外部へ送信される。
#   UI とレポートで必ず明示すること。オフラインモードとは併用できない。
providers:
  ollama:
    label: Ollama（ローカル）
    local: true
    note: 質問文もデータもローカルから出ない
  anthropic:
    label: Claude API
    local: false
    requires_env: ANTHROPIC_API_KEY
    terms: https://www.anthropic.com/legal/commercial-terms
    note: 商用利用可（Anthropic 商用利用規約）。ただし質問文と実行結果が Anthropic に送信される
    models:
      # モデル ID は claude-api スキルの表（2026-06 時点）に基づく
      - name: claude-opus-5
        label: Claude Opus 5
        context: 1000000
        input_per_mtok: 5.0
        output_per_mtok: 25.0
        recommended: true
        note: 既定。1M context なのでシステムプロンプトの制約から解放される
      - name: claude-sonnet-5
        label: Claude Sonnet 5
        context: 1000000
        input_per_mtok: 3.0
        output_per_mtok: 15.0
        note: 大量に回すとき
      - name: claude-opus-4-8
        label: Claude Opus 4.8
        context: 1000000
        input_per_mtok: 5.0
        output_per_mtok: 25.0
      - name: claude-haiku-4-5
        label: Claude Haiku 4.5
        context: 200000
        input_per_mtok: 1.0
        output_per_mtok: 5.0
        note: 抽出フェーズだけ安く回したいとき
    # 4.6 以降のモデルは temperature を受け付けない（400 になる）
    no_temperature_prefixes: [claude-opus-5, claude-sonnet-5, claude-opus-4, claude-sonnet-4-6, claude-fable-5]
