<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biomni 仮説構築</title>
<!-- 外部リクエストを増やさないため data URI。無いとブラウザが /favicon.ico を
     取りに行って毎回 404 がコンソールに出る -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A7%AC%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#fbfbfa; --fg:#1c1b1a; --muted:#6b6a67; --line:#e3e2df; --card:#fff;
    --accent:#3a5a9b; --warn:#8a6d1f; --err:#a03535; --ok:#2f6b45; --dim:#f4f3f1;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1a19; --fg:#eceae6; --muted:#9a9894; --line:#33322f; --card:#232220;
            --accent:#8aa9de; --warn:#d3b45f; --err:#e08a8a; --ok:#7fc79b; --dim:#2a2927; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.65 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  header { border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:14px;
           align-items:baseline; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:650; }
  header .meta { color:var(--muted); font-size:12.5px; }
  header .spacer { flex:1; }
  header a { color:var(--accent); text-decoration:none; font-size:13px; }
  header a:hover { text-decoration:underline; }
  main { display:grid; grid-template-columns:minmax(340px,420px) 1fr; min-height:calc(100vh - 49px); }
  @media (max-width:920px) { main { grid-template-columns:1fr; } }
  .panel { padding:18px 20px; }
  .panel.left { border-right:1px solid var(--line); }
  label { display:block; font-size:12.5px; font-weight:600; margin:13px 0 4px; }
  label .opt { font-weight:400; color:var(--muted); }
  input[type=text], textarea, select {
    width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
    background:var(--card); color:var(--fg); font:inherit; font-size:14px; }
  textarea { resize:vertical; min-height:74px; }
  .hintline { font-size:12px; color:var(--muted); margin-top:3px; }
  .modes { display:flex; gap:6px; }
  .modes button, .tabs button {
    padding:7px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card);
    color:var(--fg); cursor:pointer; font:inherit; font-size:12.5px; }
  .modes button { flex:1; }
  .modes button[aria-pressed=true], .tabs button[aria-pressed=true] {
    border-color:var(--accent); color:var(--accent); font-weight:650; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  details { margin-top:13px; border-top:1px solid var(--line); padding-top:9px; }
  summary { cursor:pointer; font-size:12.5px; font-weight:600; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  button.primary { background:var(--accent); color:#fff; border:none; padding:9px 15px;
                   border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line);
                 padding:9px 13px; border-radius:6px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .msg { padding:7px 9px; border-radius:6px; font-size:12.5px; margin:7px 0; border:1px solid var(--line);
         white-space:pre-wrap; overflow-x:auto; }   /* traceback を折り返して見せる */
  .msg.error { color:var(--err); border-color:var(--err); }
  .msg.warning { color:var(--warn); border-color:var(--warn); }
  .msg.info { color:var(--muted); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:9px;
        overflow-x:auto; font-family:var(--mono); font-size:11.5px; white-space:pre-wrap; margin:6px 0; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabpage { display:none; } .tabpage.on { display:block; }
  h2 { font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:20px 0 8px; }
  h2:first-child { margin-top:0; }
  .answer { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
            border-radius:8px; padding:15px 17px; font-size:15.5px; }
  .live { background:var(--dim); border:1px dashed var(--line); border-radius:6px; padding:9px 11px;
          font-family:var(--mono); font-size:11.5px; white-space:pre-wrap; max-height:190px;
          overflow-y:auto; color:var(--muted); }
  .live .cursor { animation:blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity:0; } }
  .step { border-left:2px solid var(--line); padding:3px 0 3px 11px; margin-bottom:2px; font-size:13px; }
  .step .k { font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; }
  .step.execute { border-left-color:var(--accent); } .step.observation { border-left-color:var(--ok); }
  .step.policy_blocked { border-left-color:var(--err); } .step.solution { border-left-color:var(--warn); }
  .step.parsing_error { border-left-color:var(--warn); background:rgba(255,176,0,.07); }
  ul.plan { list-style:none; padding:0; margin:0; }
  ul.plan li { padding:5px 0 5px 26px; position:relative; line-height:1.55; }
  ul.plan li::before { position:absolute; left:2px; top:5px; font-weight:600; }
  ul.plan li.todo::before   { content:"☐"; color:var(--muted); }
  ul.plan li.done::before   { content:"✓"; color:var(--ok); }
  ul.plan li.failed::before { content:"✗"; color:var(--err); }
  ul.plan li.done   { color:var(--muted); }
  ul.plan li.failed { color:var(--err); }
  ul.plan .note { color:var(--muted); font-size:12px; margin-left:6px; }
  .plancard { border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:12px; }
  .planbar { height:4px; background:var(--dim); border-radius:2px; overflow:hidden; margin-top:8px; }
  .planbar > i { display:block; height:100%; background:var(--ok); }
  .step.plan { border-left-color:var(--accent); }
  ol.reasoning { list-style:none; padding:0; margin:0; }
  .rp { border:1px solid var(--line); border-left-width:4px; border-radius:8px;
        padding:10px 12px; margin-bottom:10px; }
  .rp.supports { border-left-color:var(--ok); }
  .rp.refutes  { border-left-color:var(--err); background:rgba(220,60,60,.05); }
  .rp.context  { border-left-color:var(--line); }
  .rp-head { display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .rp-head b { font-weight:600; }
  .rp-find { color:var(--muted); margin:4px 0 8px; line-height:1.6; }
  .rp-noev { color:var(--warn); font-size:12px; margin-top:4px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line);
           white-space:nowrap; }
  .badge.supports { border-color:var(--ok); color:var(--ok); }
  .badge.refutes  { border-color:var(--err); color:var(--err); }
  .badge.w-decisive { border-color:var(--warn); color:var(--warn); font-weight:600; }
  ul.unc { margin:0; padding-left:20px; color:var(--muted); line-height:1.7; }
  .step button.more { background:none; border:none; color:var(--accent); cursor:pointer;
                      font:inherit; font-size:11.5px; padding:0 4px; }
  .hyp { border:1px solid var(--line); border-radius:8px; padding:13px 15px; margin-bottom:11px; background:var(--card); }
  .hyp h3 { margin:0 0 5px; font-size:14.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0; }
  .chip { font-size:11.5px; border:1px solid var(--line); border-radius:999px; padding:2px 9px;
          cursor:pointer; background:var(--card); color:var(--fg); }
  .chip.verified { border-color:var(--ok); color:var(--ok); }
  .chip.failed, .chip.refutes { border-color:var(--err); color:var(--err); }
  .empty { color:var(--muted); }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  .drawer { position:fixed; top:0; right:0; width:min(460px,94vw); height:100%; background:var(--card);
            border-left:1px solid var(--line); padding:20px; overflow-y:auto; z-index:20;
            box-shadow:-6px 0 24px rgba(0,0,0,.12); display:none; }
  .drawer.on { display:block; }
  .drawer .close { float:right; background:none; border:none; font-size:19px; cursor:pointer; color:var(--muted); }
  .bar { height:6px; background:var(--dim); border-radius:3px; overflow:hidden; margin:4px 0 10px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  optgroup { font-style:normal; }
  .hfilters { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  .hfilters input[type=text] { flex:1 1 260px; }
  .hfilters select { flex:0 0 auto; width:auto; min-width:110px; }
  .hitem { border:1px solid var(--line); border-radius:8px; padding:11px 13px; margin-bottom:9px;
           background:var(--card); cursor:pointer; }
  .hitem:hover { border-color:var(--accent); }
  .hitem h4 { margin:0 0 4px; font-size:14px; font-weight:600; }
  .hitem .cond { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 4px; }
  .hitem .cond span { font-size:11px; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted); }
  .hitem .ans { font-size:13px; color:var(--muted); }
  .hitem .meta { font-size:11.5px; color:var(--muted); margin-top:5px; }
  .hitem .del { float:right; background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; }
</style>
</head>
<body>
<header>
  <h1>Biomni 仮説構築</h1>
  <span class="meta" id="meta">読み込み中…</span>
  <span class="spacer"></span>
  <a href="/history">調査履歴 →</a>
</header>

<main>
  <section class="panel left">
    <label>調べ方</label>
    <div class="modes" id="modes"></div>
    <div class="hintline" id="modeDesc"></div>

    <label for="template">例から始める <span class="opt">任意</span></label>
    <select id="template"><option value="">（空から書く）</option></select>

    <label for="text">調べたいこと <span class="opt">必須</span></label>
    <textarea id="text" placeholder="例) トリプルネガティブ乳がんで PARP 阻害剤耐性を規定する因子の候補は？"></textarea>
    <div class="hintline">知りたい「関係」を書くと精度が上がります</div>

    <div class="row">
      <div><label for="organism">生物種</label><input type="text" id="organism" placeholder="ヒト"></div>
      <div><label for="maxHyp">仮説の上限</label><input type="text" id="maxHyp" value="5"></div>
    </div>
    <label for="context">対象 <span class="opt">疾患・組織・細胞株・条件</span></label>
    <input type="text" id="context" placeholder="トリプルネガティブ乳がん、オラパリブ投与下">
    <label for="focus">注目する遺伝子・経路・薬剤 <span class="opt">カンマ区切り</span></label>
    <input type="text" id="focus" placeholder="BRCA1, BRCA2, 相同組換え修復">
    <label for="background">既に分かっていること <span class="opt">任意</span></label>
    <textarea id="background"></textarea>

    <label for="model">モデル</label>
    <select id="model"></select>
    <div class="hintline" id="modelNote"></div>

    <details>
      <summary>実行設定</summary>
      <div class="row">
        <div><label for="maxSteps">最大ステップ</label><input type="text" id="maxSteps" value="60"></div>
        <div><label for="numCtx">num_ctx</label><input type="text" id="numCtx" placeholder="自動"></div>
      </div>
      <label style="font-weight:400;margin-top:11px">
        <input type="checkbox" id="offline"> オフラインモード（外部 DB を使わず、質問を一切外部に送らない）
      </label>
    </details>

    <div id="hints"></div>
    <div class="actions">
      <button class="primary" id="run">調べる</button>
      <button class="ghost" id="preview">プロンプトを確認</button>
      <button class="ghost" id="cancel" style="display:none">停止</button>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="answer" aria-pressed="true">回答</button>
      <button data-tab="hyp" aria-pressed="false">仮説</button>
      <button data-tab="sources" aria-pressed="false">集めた情報</button>
      <button data-tab="trace" aria-pressed="false">実行トレース</button>
    </div>
    <div id="status"></div>
    <div class="tabpage on" id="tab-answer"><p class="empty">左で調べたいことを入力して「調べる」を押してください。</p></div>
    <div class="tabpage" id="tab-hyp"></div>
    <div class="tabpage" id="tab-sources"></div>
    <div class="tabpage" id="tab-trace"></div>
  </section>
</main>

<div class="drawer" id="drawer"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let MODES = [], TEMPLATES = [], mode = "hypothesis", runId = null, es = null, RESULT = null, STEPS = [];

function errorText(detail, statusText) {
  // 500 の本文が空だと `Internal Server Error` の 7 文字しか出ない。
  // サーバが理由と traceback を返すようにしたので、あるものは全部見せる。
  if (typeof detail !== "object" || detail === null) return detail || statusText;
  const parts = [detail.detail || JSON.stringify(detail)];
  if (detail.where) parts.push(`（${detail.where}）`);
  if (detail.traceback) parts.push("\n" + detail.traceback);
  return parts.join(" ");
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(errorText(b.detail, r.statusText));
  return b;
}
function collect() {
  return { text:$("text").value.trim(), mode, organism:$("organism").value.trim(),
    context:$("context").value.trim(),
    focus:$("focus").value.split(/[,、/\n]+/).map(s=>s.trim()).filter(Boolean),
    background:$("background").value.trim(), exclude:[], dataset_ids:[],
    max_hypotheses:parseInt($("maxHyp").value,10)||5 };
}
function renderHints(hints) {
  $("hints").innerHTML = (hints||[]).map(h =>
    `<div class="msg ${h.severity}">${h.severity==="error"?"❌":h.severity==="warning"?"⚠️":"ℹ️"} ${esc(h.message)}</div>`).join("");
}
function showTab(name) {
  [...$("tabs").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === name));
  // タブ名をここに列挙しない。増やしたときに書き足し忘れると、
  // ボタンは反応するのに中身が出ない状態になる（履歴タブで実際に起きた）。
  document.querySelectorAll(".tabpage").forEach(p => p.classList.toggle("on", p.id === "tab-" + name));
}
$("tabs").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  showTab(b.dataset.tab);
};

async function boot() {
  const [health, models, templates] = await Promise.all([
    api("/api/health"), api("/api/models"), api("/api/question/templates")]);
  const dep = health.dependencies;
  // 「接続済み」だけでは足りない。繋がっていても、商用ポリシーで全部弾かれて
  // 1 つも選べない状態がある。使える数まで出す
  const localUsable = models.models.filter(m => m.local && m.installed && m.allowed).length;
  const localTotal  = models.models.filter(m => m.local && m.installed).length;
  // 「到達できる」と「モデルがある」は別。0 件なら、手元の ollama list とは
  // 違う Ollama を見ている（別ポート・コンテナ版・別ユーザー）
  const ollamaBit = !health.ollama.reachable
    ? `<span style="color:var(--warn)">Ollama 未接続</span>`
    : localTotal === 0
      ? `<span style="color:var(--err)">Ollama にモデルが 1 件もありません</span>`
      : localUsable
        ? `Ollama 接続済み（使えるモデル ${localUsable}/${localTotal}）`
        : `<span style="color:var(--warn)">Ollama 接続済みだが使えるモデルなし</span>`;
  $("meta").innerHTML = `商用モード · policy v${health.policy_version} · ` + ollamaBit
    + (dep && !dep.ok ? ` · <span style="color:var(--err)">依存不足: ${esc(dep.install)}</span>` : "")
    + ` · <span title="いま動いているビルド">v${esc(health.version)}${
        health.build ? " " + esc(health.build) : ""}</span>`;

  // 保存先を逃がした場合は黙っていない。どこに保存しているか出す
  const st = health.store;
  if (st && st.fallback) {
    renderHints([{severity:"warning", message:
      `保存先を ${st.fallback.using} に変更しました。`
      + `\n${st.fallback.wanted} を開けません（${st.fallback.reason}）。`
      + `\nこの場所で残したい場合は .env の HYPO_WORKSPACE を書ける場所に設定してください。`}]);
  } else if (st && st.ok === false) {
    renderHints([{severity:"error", message:`結果を保存できません。\n${st.error}`}]);
  }

  MODES = templates.modes;
  $("modes").innerHTML = MODES.map(m => `<button data-mode="${m.id}" aria-pressed="${m.id===mode}">${esc(m.label)}</button>`).join("");
  $("modes").onclick = e => { const b = e.target.closest("button"); if (!b) return; setMode(b.dataset.mode); };
  setMode(mode);

  TEMPLATES = templates.templates;
  $("template").innerHTML = `<option value="">（空から書く）</option>` +
    TEMPLATES.map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join("");
  $("template").onchange = () => {
    const t = TEMPLATES.find(x => x.id === $("template").value); if (!t) return;
    $("text").value=t.text; $("organism").value=t.organism; $("context").value=t.context;
    $("focus").value=(t.focus||[]).join(", "); $("background").value=t.background; setMode(t.mode);
  };

  // モデル: ローカル / クラウドを分けて出す。使えないものも理由付きで残す
  const groups = { "ローカル (Ollama)": [], "クラウド (Claude API)": [] };
  models.models.forEach(m => groups[m.local ? "ローカル (Ollama)" : "クラウド (Claude API)"].push(m));
  $("model").innerHTML = Object.entries(groups).filter(([,v]) => v.length).map(([g, list]) =>
    `<optgroup label="${g}">` + list.map(m => {
      const bits = [m.recommended ? "★" : "", m.label || m.name];
      if (m.size_gb) bits.push(m.size_gb + "GB");
      if (m.max_context) bits.push("ctx " + m.max_context.toLocaleString());
      if (!m.local && m.input_per_mtok) bits.push(`$${m.input_per_mtok}/$${m.output_per_mtok} per 1M`);
      if (!m.allowed) bits.push("— " + m.license);
      if (!m.installed) bits.push("— " + (m.reason || "未取得"));
      const usable = m.installed && m.allowed;
      return `<option value="${esc(m.name)}" ${usable?"":"disabled"} ${m.name===models.default?"selected":""}>${esc(bits.filter(Boolean).join(" · "))}</option>`;
    }).join("") + `</optgroup>`).join("");
  $("model").onchange = updateModelNote;
  window.MODELS = models.models; updateModelNote();

  // 1 つも選べないときは、黙って空の選択欄を見せない。理由と次の一手を出す
  const blocked = models.models.filter(m => m.local && m.installed && !m.allowed);
  const anyUsable = models.models.some(m => m.installed && m.allowed);
  if (!anyUsable) {
    const lines = [`<div class="msg error">使えるモデルが 1 つもありません。</div>`];
    // 到達できているのにモデルが 0 件 = 別の Ollama を見ている。
    // ポリシーで弾かれた場合とは原因も対処もまったく違うので、混ぜない
    if (health.ollama.reachable && localTotal === 0) {
      lines.push(`<div class="msg error">`
        + `<b>${esc(health.ollama.base_url)}</b> には Ollama がいますが、モデルが 1 件もありません。<br>`
        + `手元で <code>ollama list</code> にモデルが見えているなら、`
        + `<b>アプリは別の Ollama を見ています</b>（別ポート／コンテナ版が残っている等）。<br><br>`
        + `切り分け:<br>`
        + `<code>make model-check</code><br>`
        + `<code>docker ps | grep ollama</code> — 残っていれば <code>make docker-down</code><br>`
        + `<code>bash scripts/set-provider.sh ollama</code> — 実際のポートを探して合わせます`
        + `</div>`);
    }
    if (blocked.length) {
      lines.push(`<div class="msg warning">ローカルの ${blocked.length} 件は商用利用ポリシーで使えません:<br>`
        + blocked.map(m => `・${esc(m.name)} — ${esc(m.license)}`).join("<br>")
        + `<br><br>商用可のモデルを取得してください:<br>`
        + `<code>ollama pull qwen3:14b</code>（Apache-2.0・推奨）<br>`
        + `<code>ollama pull phi4:14b</code> / <code>ollama pull deepseek-r1:14b</code>（MIT）`
        + `</div>`);
    }
    lines.push(`<div class="msg warning">Claude API を使うなら:<br>`
      + `<code>bash scripts/set-provider.sh both --key sk-ant-...</code></div>`);
    $("hints").innerHTML = lines.join("");
  } else if (blocked.length) {
    // 選べるものはあるが、弾かれたものもある。存在は伝えるが邪魔しない
    $("modelNote").innerHTML += ` <span style="color:var(--muted)">`
      + `（ローカルの ${blocked.length} 件は商用ポリシーで不可）</span>`;
  }
}
// 履歴ページから ?run=<id> で飛んでくる。描画は showResult に任せる
// （計画・論点・根拠・トレースの描画を 2 か所に持つと必ず片方が古くなる）
async function openRunFromUrl() {
  const id = new URLSearchParams(location.search).get("run");
  if (!id) return;
  try { await showResult(id); }
  catch (e) { renderHints([{severity:"error", message:`この調査を開けません: ${e.message}`}]); }
}

function setMode(m) {
  mode = m;
  [...$("modes").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  $("modeDesc").textContent = (MODES.find(x => x.id === mode) || {}).description || "";
}
function updateModelNote() {
  const m = (window.MODELS||[]).find(x => x.name === $("model").value);
  const off = $("offline");
  if (!m) { $("modelNote").textContent = ""; if (off) off.disabled = false; return; }
  $("modelNote").innerHTML = m.local
    ? `ローカル実行。質問文もデータも外部に出ません。${esc(m.note||"")}`
    : `<span style="color:var(--warn)">⚠️ クラウド実行。質問文と実行結果が Anthropic に送信されます。</span> ${esc(m.note||"")}`;
  // オフラインモードとクラウドモデルは併用できない（apply_model_selection が拒否する）。
  // 実行してからエラーになるより、選んだ時点で分かるようにする。
  if (off) {
    if (m.local) {
      off.disabled = false;
      if (off.dataset.wasChecked === "1") { off.checked = true; delete off.dataset.wasChecked; }
    } else {
      if (off.checked) { off.dataset.wasChecked = "1"; off.checked = false; }
      off.disabled = true;
    }
  }
}

$("preview").onclick = async () => {
  try {
    const r = await api("/api/question/preview", {method:"POST",
      headers:{"content-type":"application/json"}, body:JSON.stringify(collect())});
    renderHints(r.hints); showTab("trace");
    $("tab-trace").innerHTML = `<h2>エージェントに渡すプロンプト (${r.prompt_language})</h2><pre>${esc(r.prompt)}</pre>`;
  } catch (e) { renderHints([{severity:"error", message:e.message}]); }
};

$("run").onclick = async () => {
  const opts = { max_steps:parseInt($("maxSteps").value,10)||60, offline_mode:$("offline").checked };
  const ctx = parseInt($("numCtx").value,10); if (ctx) opts.num_ctx = ctx;
  try {
    const r = await api("/api/runs", {method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({input:collect(), model:$("model").value, options:opts})});
    renderHints(r.hints); runId = r.run_id; STEPS = []; RESULT = null;
    $("run").disabled = true; $("cancel").style.display = "";
    $("status").innerHTML = `<div class="msg info">実行中 — ${esc(r.model)}${r.num_ctx?` · num_ctx ${r.num_ctx.toLocaleString()}`:""}</div>`
      + (r.notes||[]).map(n => `<div class="msg warning">⚠️ ${esc(n)}</div>`).join("");
    $("tab-answer").innerHTML = `<p class="empty">調査中です。「実行トレース」で進行を確認できます。</p>`;
    $("tab-trace").innerHTML = `<h2>いま生成中</h2><div class="live" id="live"><span class="cursor">▍</span></div>
      <h2>手順</h2><div id="steps"></div>`;
    showTab("trace");
    listen(r.run_id);
  } catch (e) { renderHints([{severity:"error", message:e.message}]); }
};
$("cancel").onclick = async () => {
  if (!runId) return finish();
  $("cancel").disabled = true;
  $("status").innerHTML = `<div class="msg warning">停止しています…</div>`;
  try {
    await fetch(`/api/runs/${runId}/cancel`, { method: "POST" });
    $("status").innerHTML = `<div class="msg warning">停止しました</div>`;
  } catch (e) {
    $("status").innerHTML = `<div class="msg error">停止に失敗: ${esc(e.message)}</div>`;
  }
  $("cancel").disabled = false;
  finish();          // done イベントが来なくてもボタンを戻す
};
function finish() { if (es) { es.close(); es = null; } $("run").disabled = false; $("cancel").style.display = "none"; }

function listen(id) {
  es = new EventSource(`/api/runs/${id}/events`);
  let live = "";
  es.addEventListener("token", ev => {          // ← リアルタイム表示
    const d = JSON.parse(ev.data);
    if (d.kind === "start") live = "";
    else if (d.kind === "token") live += d.text;
    const el = $("live"); if (!el) return;
    el.innerHTML = esc(live.slice(-1400)) + '<span class="cursor">▍</span>';
    el.scrollTop = el.scrollHeight;
  });
  es.addEventListener("step", ev => {
    const s = JSON.parse(ev.data); STEPS.push(s);
    if (s.kind === "parsing_error") showParseWarning(s.text);
    if (s.kind === "plan" && s.plan && s.plan.length) {
      // 進行中は計画を上部に固定しておく。どこまで進んだかを追えるように
      let box = $("livePlan");
      if (!box) {
        box = document.createElement("div"); box.id = "livePlan";
        $("tab-trace").prepend(box);
      }
      box.innerHTML = planBlock(s.plan, 0);
    }
    const box = $("steps"); if (!box) return;
    const head = (s.code || s.text || "").split("\n").find(Boolean) || "";
    const el = document.createElement("div");
    el.className = `step ${s.kind}`;
    const body = s.code || s.text || "";
    el.innerHTML = `<span class="k">${s.idx} ${s.kind}</span> ${esc(head.slice(0,150))}`
      + (body.length > 150 ? ` <button class="more">詳細</button><pre style="display:none">${esc(body.slice(0,6000))}</pre>` : "");
    const btn = el.querySelector("button.more");
    if (btn) btn.onclick = () => { const pre = el.querySelector("pre");
      pre.style.display = pre.style.display === "none" ? "block" : "none"; };
    box.appendChild(el); el.scrollIntoView({block:"nearest"});
  });
  es.addEventListener("phase", ev => {
    const p = JSON.parse(ev.data).phase;
    $("status").innerHTML = `<div class="msg info">${esc({building_agent:"エージェント準備中",exploring:"調査中",extracting:"回答を組み立て中",verifying:"根拠を検証中"}[p] || p)}</div>`;
  });
  es.addEventListener("input_hints", ev => renderHints(JSON.parse(ev.data).hints));
  es.addEventListener("done", async () => { await showResult(id); finish(); });
  es.onerror = () => finish();
}

// モデルが <execute>/<solution> を出せていないときの警告。ステップ一覧に紛れると
// 見落とすので、状態欄に固定で出す。
function showParseWarning(text) {
  if ($("parseWarn")) return;
  const div = document.createElement("div");
  div.id = "parseWarn"; div.className = "msg warning";
  div.innerHTML = `⚠️ ${esc(text)}`;
  $("status").appendChild(div);
}

async function showResult(id) {
  const r = await api(`/api/runs/${id}`); RESULT = r; runId = id;
  const v = r.verification || {};
  $("status").innerHTML = `<div class="msg ${r.status==='succeeded'?'info':'error'}">${esc(r.status)} · ${r.steps.length} ステップ · ${r.extra?.duration_sec ?? "-"} 秒</div>`;

  // --- 回答 ---
  $("tab-answer").innerHTML = `
    <h2>回答</h2>
    <div class="answer">${esc(r.answer) || '<span class="empty">回答が得られませんでした。</span>'}</div>
    ${r.extra?.answer_is_unstructured ? '<div class="msg warning">⚠️ 構造化に失敗したため、エージェントの結論をそのまま表示しています。</div>' : ""}
    ${r.extra?.parsing_errors ? `<div class="msg warning">⚠️ モデルがタグ付きの応答を出せず、biomni が ${r.extra.parsing_errors} 回差し戻しました。${esc(r.extra.parsing_error_hint||"")}</div>` : ""}
    ${r.extra?.stopped_reason ? `<div class="msg warning">⚠️ ${esc(r.extra.stopped_reason)}</div>` : ""}
    ${planBlock(r.plan, r.plan_revisions)}
    ${reasoningBlock(r.answer_reasoning, r.answer_uncertainties)}
    <h2>この回答の根拠</h2>
    ${chips(r.answer_evidence) || '<div class="msg warning">⚠️ 検証を通った根拠が紐付いていません。</div>'}
    <h2>まとめ</h2>
    <table><tbody>
      <tr><th>仮説</th><td>${r.hypotheses.length} 件（未裏付け ${r.unsupported_ideas.length} 件）</td></tr>
      <tr><th>根拠</th><td>検証済 ${v.verified} / 検証不能 ${v.not_applicable} / 失敗 ${v.failed}</td></tr>
      <tr><th>モデル</th><td>${esc(r.config.model)}（${esc(r.config.provider)}）</td></tr>
    </tbody></table>
    <p><a href="/api/runs/${id}/report" target="_blank">Markdown レポート</a></p>`;

  // --- 仮説 ---
  $("tab-hyp").innerHTML = (r.hypotheses||[]).map((h,i) => `
    <div class="hyp"><h3>仮説 ${i+1}. ${esc(h.statement)}</h3>
      <div class="hintline">確度 ${esc(h.confidence)} · 新規性 ${esc(h.novelty)} · 根拠 ${h.evidence.length} 件</div>
      <p>${esc(h.rationale)}</p>${chips(h.evidence)}
      ${h.test_plan?.experiment ? `<div class="hintline">検証: ${esc(h.test_plan.experiment)} / ${esc(h.test_plan.readout)}</div>` : ""}
    </div>`).join("") || '<p class="empty">裏付けのある仮説は得られませんでした。</p>'
    + ((r.unsupported_ideas||[]).length ? `<h2>未裏付けの着想</h2><ul>${r.unsupported_ideas.map(h=>`<li>${esc(h.statement)}</li>`).join("")}</ul>` : "");

  // --- 集めた情報 ---
  const cited = {};
  [...(r.answer_evidence||[]), ...(r.hypotheses||[]).flatMap(h=>h.evidence)].forEach(e => cited[e.identifier] = e);
  $("tab-sources").innerHTML = `
    <h2>実際に使用したデータ・ツール</h2>
    <table><thead><tr><th>リソース</th><th>種別</th><th>ライセンス</th><th>帰属</th><th>ステップ</th></tr></thead><tbody>
    ${(r.resources_used||[]).map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.kind)}</td>
      <td>${esc(x.license)}${x.review_required?' <span style="color:var(--warn)">⚠️要確認</span>':""}</td>
      <td>${esc(x.attribution||"-")}</td><td>${x.step_idxs.join(", ")||"-"}</td></tr>`).join("")}
    </tbody></table>
    <h2>引用した文献・DB レコード（${Object.keys(cited).length} 件）</h2>
    ${chips(Object.values(cited)) || '<p class="empty">なし</p>'}
    ${(r.failed_citations||[]).length ? `<h2>検証に失敗した引用</h2><table><tbody>${
      r.failed_citations.map(f=>`<tr><td>${esc(f.identifier)}</td><td>${esc(f.reason)}</td></tr>`).join("")}</tbody></table>` : ""}`;

  // --- トレース（保存済みのものを描き直す）---
  $("tab-trace").innerHTML =
    `<h2>入力</h2><pre>${esc(r.prompt || "(なし)")}</pre><h2>手順</h2>` +
    (r.steps || []).map(s2 => {
      const body = s2.code || s2.text || "";
      const head = body.split("\n").find(Boolean) || "";
      return `<div class="step ${s2.kind}"><span class="k">${s2.idx} ${s2.kind}</span> ${esc(head.slice(0,150))}` +
        (body.length > 150 ? `<pre>${esc(body.slice(0,6000))}</pre>` : "") + `</div>`;
    }).join("");
  showTab("answer");
}

// 解析の計画。biomni は最初にチェックリスト形式の計画を立てさせ、毎ターン更新させる
// （a1.py の system prompt）。素通しすると think に埋もれるので独立させる。
function planBlock(plan, revisions) {
  if (!plan || !plan.length) return "";
  const done = plan.filter(i => i.state === "done").length;
  const failed = plan.filter(i => i.state === "failed").length;
  const pct = Math.round(done / plan.length * 100);
  return `<h2>解析の設計</h2>
    <div class="plancard">
      <ul class="plan">${plan.map(i =>
        `<li class="${esc(i.state)}">${esc(i.text)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</li>`
      ).join("")}</ul>
      <div class="planbar"><i style="width:${pct}%"></i></div>
      <div class="hintline">${done}/${plan.length} 完了${failed ? ` · ${failed} 件失敗` : ""}${
        revisions ? ` · 計画を ${revisions} 回立て直しました` : ""}</div>
    </div>`;
}

// 結論に至った論点。結論だけ出すと、読んだ人は受け入れるか捨てるかしか選べない。
// 「何を確かめて、何が分かって、それが結論をどう左右したか」を開く。
const STANCE_LABEL = {supports:"支持", refutes:"反証", context:"判断材料"};
const WEIGHT_LABEL = {decisive:"決め手", supporting:"補強", weak:"弱い"};

function reasoningBlock(points, uncertainties) {
  points = points || []; uncertainties = uncertainties || [];
  if (!points.length && !uncertainties.length) {
    return `<h2>この結論に至った論点</h2>
      <div class="msg warning">⚠️ 論点を抽出できませんでした。抽出モデルが結論だけを
      返しています。より大きなモデル（qwen3:14b 以上、または Claude）を試すか、
      「実行トレース」で調査の手順そのものを確認してください。</div>`;
  }
  let html = "";
  if (points.length) {
    // 反証は埋もれさせない。決め手 -> 反証 -> それ以外の順に出す
    const order = {decisive:0, supporting:1, weak:2};
    const sorted = [...points].sort((a,b) =>
      (a.stance === "refutes" ? -1 : 0) - (b.stance === "refutes" ? -1 : 0)
      || (order[a.weight] ?? 1) - (order[b.weight] ?? 1));
    html += `<h2>この結論に至った論点（${points.length} 件）</h2><ol class="reasoning">` +
      sorted.map(pt => `<li class="rp ${esc(pt.stance)}">
        <div class="rp-head">
          <span class="badge ${esc(pt.stance)}">${esc(STANCE_LABEL[pt.stance] || pt.stance)}</span>
          <span class="badge w-${esc(pt.weight)}">${esc(WEIGHT_LABEL[pt.weight] || pt.weight)}</span>
          <b>${esc(pt.point)}</b>
        </div>
        ${pt.finding ? `<div class="rp-find">${esc(pt.finding)}</div>` : ""}
        ${chips(pt.evidence) || '<div class="rp-noev">検証を通った根拠なし</div>'}
      </li>`).join("") + `</ol>`;
  }
  if (uncertainties.length) {
    html += `<h2>分からなかったこと</h2><ul class="unc">` +
      uncertainties.map(u => `<li>${esc(u)}</li>`).join("") + `</ul>`;
  }
  return html;
}

function chips(list) {
  if (!list || !list.length) return "";
  return `<div class="chips">` + list.map((e,i) => {
    const cls = e.stance === "refutes" ? "refutes" : (e.verification_status || "");
    const mark = {verified:"✓", not_applicable:"−", unverified:"?", failed:"✕"}[e.verification_status] || "";
    return `<button class="chip ${cls}" data-ev='${esc(JSON.stringify(e))}'>${mark} ${esc(e.identifier)}${e.stance==="refutes"?" · 反証":""}</button>`;
  }).join("") + `</div>`;
}

// 根拠チップ -> ドロワー（抜粋と由来ステップを見せる）
document.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (chip && chip.dataset.ev) {
    const ev = JSON.parse(chip.dataset.ev);
    const step = STEPS.find(s => s.idx === ev.step_idx) || (RESULT?.steps || []).find(s => s.idx === ev.step_idx);
    const src = (RESULT?.steps || []).find(s => s.kind === "execute" && s.idx === ev.step_idx - 1);
    $("drawer").innerHTML = `<button class="close" onclick="document.getElementById('drawer').classList.remove('on')">×</button>
      <h2>${esc(ev.kind)}</h2><h3 style="margin:0 0 8px">${ev.url?`<a href="${esc(ev.url)}" target="_blank">${esc(ev.identifier)}</a>`:esc(ev.identifier)}</h3>
      <table><tbody>
        <tr><th>立場</th><td>${esc(ev.stance)}</td></tr>
        <tr><th>検証</th><td>${esc(ev.verification_status)} — ${esc(ev.verification_note||"")}</td></tr>
      </tbody></table>
      ${ev.why ? `<h2>なぜこれが根拠になるか</h2><p>${esc(ev.why)}</p>` : ""}
      <h2>実行結果からの抜粋</h2><pre>${esc(ev.excerpt||"(なし)")}</pre>
      ${src ? `<h2>この結果を出したコード（ステップ ${src.idx}）</h2><pre>${esc(src.code)}</pre>` : ""}
      ${step && step.text ? `<h2>ステップ ${step.idx} の出力</h2><pre>${esc(step.text.slice(0,3000))}</pre>` : ""}`;
    $("drawer").classList.add("on");
  } else if (!e.target.closest(".drawer")) {
    $("drawer").classList.remove("on");
  }
});

boot().then(openRunFromUrl).catch(e => { $("meta").textContent = "起動に失敗: " + e.message; });
</script>
</body>
</html>
